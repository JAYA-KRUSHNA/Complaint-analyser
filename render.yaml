services:
  # ─── FastAPI Production Backend ───────────────────────────────
  - type: web
    name: civisense-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://civisense-frontend.onrender.com,http://localhost:5173"
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string in Render Dashboard
      - key: DATABASE_URL_SYNC
        sync: false
      - key: STORAGE_BACKEND
        value: local

  # ─── React Production Frontend ────────────────────────────────
  - type: web
    name: civisense-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://civisense-backend.onrender.com"
