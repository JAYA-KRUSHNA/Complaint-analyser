services:
  # ─── FastAPI Backend (Supabase Cloud DB) ──────────────────────
  - type: web
    name: civisense-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head && python -m seed.seed_data"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # ── Supabase Database ──
      - key: DATABASE_URL
        value: "postgresql+asyncpg://postgres:ammananna16222607@db.pigkhcziyqlnnfqktbyg.supabase.co:5432/postgres"
      - key: DATABASE_URL_SYNC
        value: "postgresql://postgres:ammananna16222607@db.pigkhcziyqlnnfqktbyg.supabase.co:5432/postgres"
      # ── CORS (update after frontend deploys) ──
      - key: CORS_ORIGINS
        value: "https://civisense-frontend.onrender.com,http://localhost:5173"
      # ── Email OTP (Gmail SMTP) ──
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "jayajrushna1622@gmail.com"
      - key: SMTP_PASS
        value: "wlpvsxequycydhvo"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      # ── Storage ──
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads

  # ─── React Frontend (Static Site) ─────────────────────────────
  - type: web
    name: civisense-frontend
    runtime: static
    region: singapore
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://civisense-backend.onrender.com"
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyA-Eg9JnKiP7fCsUTeX1JGtxnbfHa7TJtc"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "civic-sense-509e8.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "civic-sense-509e8"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "civic-sense-509e8.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "901987042347"
      - key: VITE_FIREBASE_APP_ID
        value: "1:901987042347:web:312ddda63b2d37dff9d66e"
